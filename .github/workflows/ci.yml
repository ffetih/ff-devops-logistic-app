# Every push and pull request: build and test with the same script as locally, render
# what Argo CD will render, and build the documentation site. On a push to main, after both pass, publish the images of the
# services this push changed to GHCR and commit their new tags into
# deploy/apps/*/image-local.yaml. Argo CD then shows those Applications OutOfSync until
# someone syncs them.
#
# The tag commit carries [skip ci] in its message; GitHub does not start workflows for it.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to the same branch cancels the run that is still going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  java:
    name: Java build and tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - run: ./build-all.sh
      # One artifact per jar, uploaded with the path the Dockerfile copies from.
      - uses: actions/upload-artifact@v4
        with:
          name: ff-logistics-app-jar
          retention-days: 1
          if-no-files-found: error
          path: platform/ff-logistics/ff-logistics-app/target/siose-ff-logistics-app.jar
      - uses: actions/upload-artifact@v4
        with:
          name: ff-identity-jar
          retention-days: 1
          if-no-files-found: error
          path: platform/ff-identity/identity-service/target/siose-ff-identity-service.jar

  manifests:
    name: Render manifests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: azure/setup-helm@v4
      # Each service the way Argo CD renders it: the shared chart, then its two values files.
      - name: Helm lint and template
        run: |
          set -euo pipefail
          for app in deploy/apps/*/; do
            name="$(basename "$app")"
            echo "::group::$name"
            files=(-f "$app/values.yaml" -f "$app/values-local.yaml" -f "$app/image-local.yaml")
            helm lint deploy/charts/ff-service "${files[@]}"
            helm template "$name" deploy/charts/ff-service "${files[@]}" > /dev/null
            echo "::endgroup::"
          done
          # Every shape the chart can render, whichever one the services use today.
          base=(-f deploy/apps/logistics-app/values.yaml -f deploy/apps/logistics-app/values-local.yaml -f deploy/apps/logistics-app/image-local.yaml)
          helm template x deploy/charts/ff-service "${base[@]}" --set rollout.enabled=false --set migration.enabled=false > /dev/null
          helm template x deploy/charts/ff-service "${base[@]}" --set rollout.enabled=true --set rollout.strategy=canary --set rollout.canary.analysis.enabled=false > /dev/null
          helm template x deploy/charts/ff-service "${base[@]}" --set rollout.enabled=true --set rollout.strategy=blueGreen > /dev/null
      - name: Kustomizations
        run: |
          set -euo pipefail
          kubectl kustomize deploy/argocd > /dev/null
          kubectl kustomize deploy/platform/argo-rollouts > /dev/null
          kubectl kustomize deploy/platform/postgres > /dev/null
          kubectl kustomize deploy/platform/keycloak > /dev/null
          kubectl kustomize deploy/platform/rustfs > /dev/null
          kubectl kustomize deploy/platform/kafka > /dev/null

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          # The whole history: each guide's revision table is made from git log.
          fetch-depth: 0
      # Fails on any warning (--failure-level WARN), so a broken cross reference fails the run.
      - run: ./docs/build-docs.sh
      - uses: actions/upload-artifact@v4
        with:
          name: docs-html
          path: docs/build/html
          retention-days: 7

  images:
    name: Publish images
    needs: [java, manifests]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v5
        with:
          # The whole history, so this push can be compared with what main was before it.
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: ff-logistics-app-jar
          path: platform/ff-logistics/ff-logistics-app/target
      - uses: actions/download-artifact@v4
        with:
          name: ff-identity-jar
          path: platform/ff-identity/identity-service/target
      - name: Build and push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          # A service gets a new image only when this push changed something it is built from:
          # its own folder, the base libraries or the Maven Wrapper. A change to values or docs
          # alone keeps the current image, so it does not start a new rollout. Without a usable
          # "before" (the first push, a forced push) every service is built.
          if ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            BEFORE=""
          fi
          changed() {
            [ -z "$BEFORE" ] || ! git diff --quiet "$BEFORE" "$GITHUB_SHA" -- "$1" base .mvn mvnw
          }
          : > "$RUNNER_TEMP/published"
          # Images live under the repository's name (ghcr.io/<owner>/<repo>/<service>), so a new
          # package is created by and linked to this repository. A bare ghcr.io/<owner>/<service>
          # may already belong to another repository, and then GITHUB_TOKEN cannot write to it.
          prefix="$(echo "ghcr.io/${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')"
          echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          publish() {
            if ! changed "$2"; then
              echo "$1: nothing under $2, base/ or the wrapper changed; keeping its current image"
              return
            fi
            image="${prefix}/$1:${GITHUB_SHA}"
            # The source label links the package to this repository on GitHub.
            docker build --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" -t "$image" "$2"
            docker push "$image"
            echo "$1" >> "$RUNNER_TEMP/published"
          }
          publish identity platform/ff-identity/identity-service
          publish logistics-app platform/ff-logistics/ff-logistics-app
      - name: Commit image tags
        run: |
          set -euo pipefail
          git fetch origin main
          # Another push landed meanwhile: its own run records newer tags, this one stays out.
          if [ "$(git rev-parse origin/main)" != "$GITHUB_SHA" ]; then
            echo "origin/main has moved past ${GITHUB_SHA}; leaving the recorded tags alone"
            exit 0
          fi
          if [ ! -s "$RUNNER_TEMP/published" ]; then
            echo "no image was published; nothing to record"
            exit 0
          fi
          git checkout -B main
          # The whole file is rewritten: it holds the tag and nothing a person edits.
          while read -r app; do
            printf '%s\n' \
              "# Written by CI on every push to main (.github/workflows/ci.yml): the image it just" \
              "# published. Nothing else lives here, so the bot's commit never touches a line that a" \
              "# person edits in values-local.yaml. For an image loaded with \`k3d image import\`, set the" \
              "# tag to \"local\" here by hand." \
              "image:" \
              "  tag: ${GITHUB_SHA}" > "deploy/apps/$app/image-local.yaml"
          done < "$RUNNER_TEMP/published"
          git add deploy/apps/*/image-local.yaml
          if git diff --cached --quiet; then
            echo "image tags already record ${GITHUB_SHA}"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Publish image tags for ${GITHUB_SHA::7}" -m "[skip ci]"
          git push origin HEAD:main
