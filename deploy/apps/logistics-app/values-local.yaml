# Logistics app on the local k3d cluster. Read after values.yaml, so it wins.
service:
  type: NodePort
  nodePort: 30081 # host port 8081

# Canary with analysis. Four pods so the weights are whole pods: 25% is one canary pod.
replicaCount: 4

rollout:
  enabled: true
  strategy: canary
  canary:
    analysis:
      enabled: true
    steps:
      - setWeight: 25
      # Three reads of /actuator/health/release on the canary pod, 10 s apart
      - analysis:
          templates:
            - templateName: logistics-app-release
      - setWeight: 50
      - pause: {duration: 30s}
      - setWeight: 100

# Flyway runs in a PreSync hook Job before each sync, not in the pods.
migration:
  enabled: true

# After each sync, once the canary has finished: sign in as the realm's demo planner and call
# the API the way a client does. A failed check marks the sync Failed.
smokeTest:
  enabled: true
  token:
    url: http://identity:8085/sessions
    secret: smoke-test-user
  checks:
    - {path: /actuator/health/readiness, status: 200, contains: '"status":"UP"'}
    - {path: /api/v1/me, status: 401}
    - {path: /api/v1/me, status: 200, token: true, contains: '"tenantId":"ff-eu-freight"'}
    - {path: /api/v1/wms/warehouses, status: 200, token: true}
    - {path: /api/v1/wms/asns, status: 200, token: true}

# Every variable in one list: Helm replaces lists, it does not merge them, so an env list in
# another values file would drop these.
env:
  # The postgres Application in the same namespace (deploy/platform/postgres)
  - name: LOGISTICS_DB_URL
    value: jdbc:postgresql://postgres:5432/ff_logistics
  - name: LOGISTICS_DB_USERNAME
    valueFrom:
      secretKeyRef:
        name: postgres-credentials
        key: username
  - name: LOGISTICS_DB_PASSWORD
    valueFrom:
      secretKeyRef:
        name: postgres-credentials
        key: password
  # Tokens are checked against the identity service's keys; their issuer is Keycloak's
  # public address (deploy/platform/keycloak).
  - name: IDENTITY_JWKS_URI
    value: http://identity:8085/jwks
  - name: IDENTITY_TOKEN_ISSUER
    value: http://localhost:8180/realms/ff-logistics
  # A broken release on purpose: set "false", commit, sync. The analysis fails at 25% and the
  # rollout aborts. Set it back to "true" (or revert the commit) and sync to recover.
  - name: FF_RELEASE_HEALTHY
    value: "true"
