# The logistics app: the shared chart with this service's values. The last values file
# wins, so values-local.yaml overrides values.yaml, which overrides the chart's defaults.
#
# No automated sync. This machine has one cluster and main is the only environment a sync
# can reach: a merged change shows as OutOfSync and waits for a manual sync.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: logistics-app
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: ff-logistics
spec:
  project: ff-logistics
  source:
    repoURL: https://github.com/ffetih/ff-devops-logistic-app.git
    targetRevision: main
    path: deploy/charts/ff-service
    helm:
      releaseName: logistics-app
      valueFiles:
        - ../../apps/logistics-app/values.yaml
        - ../../apps/logistics-app/values-local.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: ff-logistics
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
