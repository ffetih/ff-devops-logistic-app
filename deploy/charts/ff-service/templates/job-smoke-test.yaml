{{- if .Values.smokeTest.enabled }}
# Argo CD runs this after the sync, once every resource is Healthy. For a Rollout that means
# after the last canary step: the test calls the release that now takes all traffic. A failed
# check fails the Job, and the sync is marked Failed. Nothing is rolled back; the failure is
# the signal to look, or to roll back by hand. A canary that aborts never becomes Healthy,
# so the test does not run on it.
# BeforeHookCreation: the Job and its log stay until the next sync replaces them.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "ff-service.name" . }}-smoke-test
  labels:
    app.kubernetes.io/name: {{ include "ff-service.name" . }}-smoke-test
    app.kubernetes.io/part-of: ff-logistics
    app.kubernetes.io/version: {{ .Values.image.tag | trunc 63 | quote }}
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  # A smoke test that only passes on a second try is a failed smoke test.
  backoffLimit: 0
  activeDeadlineSeconds: {{ .Values.smokeTest.activeDeadlineSeconds }}
  template:
    metadata:
      # Not the service's own labels: its Services must never select this pod.
      labels:
        app.kubernetes.io/name: {{ include "ff-service.name" . }}-smoke-test
        app.kubernetes.io/part-of: ff-logistics
    spec:
      restartPolicy: Never
      enableServiceLinks: false
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: smoke-test
          image: {{ .Values.smokeTest.image | quote }}
          command: ["sh", "/smoke-test/smoke-test.sh"]
          env:
            # The Service, not a pod: what every client of the service reaches
            - name: BASE_URL
              value: "http://{{ include "ff-service.name" . }}.{{ .Release.Namespace }}.svc.cluster.local:{{ .Values.service.port }}"
            {{- with .Values.smokeTest.token }}
            {{- if .url }}
            - name: TOKEN_URL
              value: {{ .url | quote }}
            - name: SMOKE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ .secret }}
                  key: username
            - name: SMOKE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .secret }}
                  key: password
            {{- end }}
            {{- end }}
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          volumeMounts:
            - name: smoke-test
              mountPath: /smoke-test
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: smoke-test
          configMap:
            name: {{ include "ff-service.name" . }}-smoke-test
        - name: tmp
          emptyDir: {}
{{- end }}
