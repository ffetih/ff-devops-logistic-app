# keycloak:8080 inside the cluster (the issuer in every token). NodePort 30180, which k3d
# publishes on host port 8180, for the admin console and for runs from the IDE.
apiVersion: v1
kind: Service
metadata:
  name: keycloak
  labels:
    app.kubernetes.io/name: keycloak
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: keycloak
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
      nodePort: 30180
