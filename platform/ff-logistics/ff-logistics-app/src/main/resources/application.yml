server:
  port: 8081

spring:
  application:
    name: ff-logistics-app
  threads:
    virtual:
      enabled: true
  # The defaults reach the cluster's PostgreSQL through NodePort 5432, so a run from the IDE
  # needs no settings. In the cluster the chart sets LOGISTICS_DB_* from the postgres Secret.
  datasource:
    url: ${LOGISTICS_DB_URL:jdbc:postgresql://localhost:5432/ff_logistics}
    username: ${LOGISTICS_DB_USERNAME:fflogistics}
    password: ${LOGISTICS_DB_PASSWORD:fflogisticsDb2026}
  flyway:
    # Scripts in db/migration. Module tables carry the module's prefix (wms_, tms_, geo_, rep_).
    enabled: true
  security:
    oauth2:
      resourceserver:
        jwt:
          # Tokens are checked here, against the keys the identity service publishes: this process
          # never calls Keycloak. issuer-uri is the iss every token must carry (Keycloak's public
          # address), not a discovery URL. The defaults fit a run from the IDE.
          jwk-set-uri: ${IDENTITY_JWKS_URI:http://localhost:8085/jwks}
          issuer-uri: ${IDENTITY_TOKEN_ISSUER:http://localhost:8180/realms/ff-logistics}
          audiences: ff-logistics-api

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      # /actuator/health/liveness and /readiness for the Kubernetes probes. Spring Boot turns
      # these on by itself only when it detects Kubernetes; on here so the IDE and the tests
      # see the same endpoints.
      probes:
        enabled: true
      group:
        # /actuator/health/release: may this release take traffic? Read by the canary
        # analysis. Always 200, with UP or DOWN in the body, so the analysis sees an answer
        # rather than an error. Not part of liveness or readiness.
        release:
          include: releaseSwitch
          status:
            http-mapping:
              down: 200
  info:
    git:
      mode: simple

ff:
  release:
    # false (FF_RELEASE_HEALTHY=false) turns /actuator/health/release DOWN, to show what a
    # canary analysis does with a broken release.
    healthy: true

  security:
    header-fallback:
      # Local development only, switched on by the "local" profile (application-local.yml).
      enabled: false
