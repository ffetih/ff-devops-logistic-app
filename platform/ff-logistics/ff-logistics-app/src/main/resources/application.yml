server:
  port: 8081

spring:
  application:
    name: ff-logistics-app
  threads:
    virtual:
      enabled: true
  task:
    execution:
      simple:
        # Event listeners run with @Async on virtual threads, on an executor without a limit by
        # default. A burst of events would then start every listener at once, all waiting for
        # one of the 10 database connections. Above this limit the publisher waits for a slot.
        concurrency-limit: ${TASK_EXECUTION_CONCURRENCY_LIMIT:16}
  # The defaults reach the cluster's PostgreSQL through NodePort 5432, so a run from the IDE
  # needs no settings. In the cluster the chart sets LOGISTICS_DB_* from the postgres Secret.
  datasource:
    url: ${LOGISTICS_DB_URL:jdbc:postgresql://localhost:5432/ff_logistics}
    username: ${LOGISTICS_DB_USERNAME:fflogistics}
    password: ${LOGISTICS_DB_PASSWORD:fflogisticsDb2026}
  jpa:
    hibernate:
      # Flyway owns the schema; Hibernate only checks at start that the entities match it.
      ddl-auto: validate
    # A request's database work happens in its service call, not while the response is written.
    open-in-view: false
  flyway:
    # Scripts in db/migration. Module tables carry the module's prefix (wms_, tms_, geo_, rep_).
    enabled: true
  modulith:
    events:
      jdbc:
        schema-initialization:
          # event_publication is created by Flyway (V8), like every other table.
          enabled: false
      # Off: every pod would publish all unfinished events again at its start, four pods four
      # times. The outbox module resubmits them on a schedule, from one pod at a time.
      republish-outstanding-events-on-restart: false
      # Only FAILED rows are resubmitted. A row a stopped pod left PUBLISHED, PROCESSING or
      # RESUBMITTED turns FAILED once it is older than these (checked every minute). Well above
      # the time a listener needs, so a slow listener is not taken for a lost one.
      staleness:
        published: ${EVENTS_STALE_AFTER:PT5M}
        processing: ${EVENTS_STALE_AFTER:PT5M}
        resubmitted: ${EVENTS_STALE_AFTER:PT5M}
  security:
    oauth2:
      resourceserver:
        jwt:
          # Tokens are checked here, against the keys the identity service publishes: this process
          # never calls Keycloak. issuer-uri is the iss every token must carry (Keycloak's public
          # address), not a discovery URL. The defaults fit a run from the IDE.
          jwk-set-uri: ${IDENTITY_JWKS_URI:http://localhost:8085/jwks}
          issuer-uri: ${IDENTITY_TOKEN_ISSUER:http://localhost:8180/realms/ff-logistics}
          audiences: ff-logistics-api

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      # /actuator/health/liveness and /readiness for the Kubernetes probes. Spring Boot turns
      # these on by itself only when it detects Kubernetes; on here so the IDE and the tests
      # see the same endpoints.
      probes:
        enabled: true
      group:
        # /actuator/health/release: may this release take traffic? Read by the canary
        # analysis. Always 200, with UP or DOWN in the body, so the analysis sees an answer
        # rather than an error. Not part of liveness or readiness.
        release:
          include: releaseSwitch
          status:
            http-mapping:
              down: 200
  info:
    git:
      mode: simple

ff:
  release:
    # false (FF_RELEASE_HEALTHY=false) turns /actuator/health/release DOWN, to show what a
    # canary analysis does with a broken release.
    healthy: true

  security:
    header-fallback:
      # Local development only, switched on by the "local" profile (application-local.yml).
      enabled: false

# The event outbox's upkeep (package outbox). Durations are ISO-8601.
logistics:
  geo:
    max-stops: ${GEO_MAX_STOPS:99}                      # BR-GEO-07: a longer list is refused before any work
    road-matrix: ${GEO_ROAD_MATRIX:haversine}           # haversine (straight line x 1.24) or osrm
    osrm:
      base-url: ${GEO_OSRM_URL:http://localhost:5000}   # --max-table-size must fit max-stops + 1
      connect-timeout: PT2S
      read-timeout: PT5S                                # a stalled OSRM answers 503, it does not hold the request
  events:
    resubmit-delay: ${EVENTS_RESUBMIT_DELAY:PT30S}       # how often a pod tries to take the lock and resubmit
    resubmit-min-age: ${EVENTS_RESUBMIT_MIN_AGE:PT1M}    # first wait after a failure
    resubmit-max-delay: PT1H                             # the wait doubles up to this
    max-attempts: ${EVENTS_MAX_ATTEMPTS:5}               # then the row stays open for a person
    completed-retention: P7D                             # completed rows are deleted after this
